[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel"
version = "0.1.0"
description = "AI 产业投资情报系统:采集全球 AI 公司新闻/研报/舆情,并用 Claude 做情报分析"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.40",
    "yfinance>=0.2.50",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "tldextract>=5.1",
]

[project.scripts]
intel = "intel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
